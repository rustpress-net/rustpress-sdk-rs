[package]
name = "rustpress-sdk"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["RustPress Team <team@rustpress.dev>"]
description = "Official Rust SDK for RustPress - Build hooks, plugins, themes, and apps"
license = "MIT"
repository = "https://github.com/rustpress/rustpress-sdk-rs"
homepage = "https://rustpress.dev"
documentation = "https://docs.rs/rustpress-sdk"
readme = "README.md"
keywords = ["rustpress", "cms", "sdk", "hooks", "plugins"]
categories = ["web-programming", "development-tools"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
lazy_static = "1.4"
regex = "1.10"
reqwest = { version = "0.11", features = ["json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["time", "sync"] }
tracing = "0.1"
uuid = { version = "1.6", features = ["v4"] }

[[bin]]
name = "rustpress"
path = "src/bin/rustpress.rs"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
mockito = "1.2"
serde_json = "1.0"

[features]
default = ["http-client"]
http-client = ["reqwest"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
